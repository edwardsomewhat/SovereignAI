# Hermes Crew - Task Definitions
# Tasks are assigned by the hierarchical Supervisor at runtime.
# These define the scope and expected outputs for each role.

infrastructure_audit:
  description: >
    Perform a health audit of all 8 Tailscale-connected nodes. Check: uptime,
    disk space, Docker container status, GPU availability, Tailscale connectivity,
    and any systemd service failures. Report any anomalies with severity levels.
  expected_output: >
    A structured audit report with per-node status (online/offline, disk%, GPU status,
    key services running), plus a prioritized list of issues ranked by severity
    (critical/warning/info).
  agent: infra

n8n_workflow_deploy:
  description: >
    Design and deploy an N8N workflow on Charlotte (100.70.223.108) for: {workflow_spec}.
    The workflow must include error handling, retry logic, and webhook triggers
    where appropriate.
  expected_output: >
    JSON workflow definition ready for N8N import, plus a deployment summary
    confirming successful activation and describing trigger/action flow.
  agent: n8n_manager

site_management:
  description: >
    Manage the full csweb stack (100.71.6.98) for: {site_spec}.
    Scope includes DNS configuration (Cloudflare records, tunnels, SSL),
    database operations (PostgreSQL migrations, backups, queries),
    application deployment (FastAPI services, Syndicate CMS, Docker via Hawser),
    and payment integration (Stripe checkout, webhooks, subscription tiers).
    You own combustionsyndicate.com end-to-end — coordinate with Infra for
    system health and Coders for feature development on csweb services.
  expected_output: >
    Comprehensive site operations report covering the requested domain.
    For DNS: record summary (type, name, value, TTL, proxy status), tunnel status,
    SSL mode. For DB: migration results, backup hash verified, row counts.
    For deployments: endpoint URL, health check result, Docker container status.
    For payments: integration summary, webhook verification, test transaction status.
    Include any configuration variables set and rollback plans where applicable.
  agent: site_operator

code_implementation:
  description: >
    Implement the following feature or fix using the Shinobi protocol:
    {code_spec}.
    PRIMARY: shinobi_code — full swarm (scout→coder→builder→reviewer→QA→vanish).
    Use agy_code for quick single-file fixes or ollama_code for simple local tasks.
    Never write code directly — always delegate.
  expected_output: >
    Shinobi mission result: mission_id, subtask status for each phase (scout/coder/
    builder/reviewer/QA), overall PASS/FAIL/ERROR, recovery attempts if any, and
    intel archive path. Include summary of files changed and test results.
  agent: coders

vision_analysis:
  description: >
    Process the following image(s) using the sovereign-vision container on Nano
    (Coral TPU + Florence2): {vision_spec}.
    If the vision container is down, coordinate with Infra to restore it first.
  expected_output: >
    Analysis results (captions, detected objects, text extracted, or whatever
    the spec requires), plus container health confirmation and processing latency.
  agent: vision

creative_direction:
  description: >
    Parse and execute a creative brief: {creative_brief}.
    Consult the Creative Scout for resource availability (VRAM, models loaded,
    queue status). Decompose the brief into atomic tasks with dependencies,
    route to Image Studio (ComfyUI images), Video Studio (ComfyUI video),
    Copy Studio (text creative), and Review Agent (QC). Track progress,
    handle failures (retry once, then escalate), and assemble final deliverables.
    Copy and image tasks can run in parallel (different hardware).
  expected_output: >
    Project status with: brief name, phase (decomposing/routing/executing/
    assembling/done), progress (N/M tasks complete), current task, blockers,
    next steps. Final output includes all generated files with metadata
    (paths, models used, generation times, review scores), organized by
    deliverable type.
  agent: creative_director

image_generation:
  description: >
    Generate still images via ComfyUI for: {image_spec}.
    Select the appropriate model (Flux Dev fp8 for max quality, JuggernautXL for
    photoreal, photon_v1 for fast/stylized) and construct the ComfyUI workflow.
    Submit to Conchai 3090 (100.69.153.16:8188) or hq-ai P5000 as fallback.
    Handle txt2img, img2img, inpainting, upscaling, and batch variations.
  expected_output: >
    Generated image file paths with metadata: seed, model, dimensions,
    generation time in seconds. For batches: all outputs with per-image metadata.
    Include any post-processing applied (text overlay, borders, brightness check).
  agent: image_studio

video_generation:
  description: >
    Generate video clips via ComfyUI on Conchai 3090 for: {video_spec}.
    Type: t2v (text-to-video), i2v (image-to-video), or flf2v (first-last-frame).
    Select model: Wan 2.1/2.2 for high quality (~300s for 33 frames),
    Kandinsky5 Lite for fast drafts (~3 min for 61 frames).
    Verify models are real files (not Git LFS pointers) with xxd before running.
    Optionally generate and merge audio via ffmpeg.
  expected_output: >
    MP4 file path, duration, fps, model used, frame count, render time in seconds,
    and audio status (merged/silent). Include workflow JSON embedded in MP4 metadata
    for provenance. If delegation times out, check ComfyUI history directly
    (/mnt/hermes_data/comfy/output/) — render may have completed.
  agent: video_studio

copy_generation:
  description: >
    Generate text creative for: {copy_spec}.
    Types: taglines (3-8 words), ad copy (headline + body + CTA), product
    descriptions, scripts (timed to duration), social posts, brand naming.
    Write in SovereignAI's voice: confident, warm, technical, anti-subscription.
    Core message: "The absence of reliance is freedom."
  expected_output: >
    Exactly the requested count of distinct copy options, each a different
    angle/rhythm/emotional hook. Format: numbered outputs plus creative rationale.
    All outputs run through humanizer to strip AI cliches (no "unlock," "empower,"
    "game-changing," "dive into"). Every option strong enough to ship.
  agent: copy_studio

creative_review:
  description: >
    Perform vision-based quality review of: {creative_review_spec}.
    Analyze generated images/video frames using qwen3-vl:8b on hq-ai
    (fallback: gemma-4-31b-it:free via OpenRouter). Check: spelling of ALL
    visible text, legibility/contrast, composition, AI artifacts, brand
    consistency, and completeness.
  expected_output: >
    Structured review with: TEXT FOUND (all visible text, flagged errors),
    ISSUES (critical/minor/notes), SCORES (spelling, legibility, composition,
    quality — each 1-10 + overall), VERDICT (SHIP / SHIP WITH NOTES / REJECT),
    and specific feedback for regeneration if rejected.
  agent: review_agent

fabrication:
  description: >
    Process a 3D fabrication request via the Fab Studio pipeline: {fab_spec}.
    Pipeline: analyze scanned OBJ from Creality Ferret → Florence 2 vision analysis
    on Jetson Orin → generate parametric CAD in OpenSCAD → render STL/STEP output.
    Use import() to reference scanned mesh as negative space where needed.
    NOT diffusion 3D — this is engineering CAD for physical manufacturing.
    Target use cases: arcade cabinets, TV boxes, e-scooter body panels, Hermes shell.
  expected_output: >
    OpenSCAD source file, rendered STL/STEP file path, Florence 2 analysis summary
    of the scanned object, and dimensions/measurements used. Include render time
    and any assumptions about the physical object's geometry.
  agent: fab_studio

quality_gate:
  description: >
    Perform a critical quality assessment of: {qa_spec}.
    Evaluate: correctness (does it solve the problem?), completeness
    (are edge cases handled?), security (any vulnerabilities?),
    and production readiness (is it deployable?).
    Do NOT re-run tests the coder already ran — focus on judgment.
  expected_output: >
    Verdict (PASS/FLAG/REJECT) with specific, actionable feedback.
    For FLAG: what needs to change. For REJECT: why it can't ship.
    Include the reasoning behind each finding.
  agent: qa

code_review:
  description: >
    Review the following code changes by deploying a Shinobi swarm:
    {review_spec}.
    PRIMARY: shinobi_code — scout maps the changes, reviewer evaluates,
    QA provides final verdict. Falls back to ollama_code for quick reviews.
  expected_output: >
    Shinobi review packet: reviewer assessment, specific issues found,
    QA verdict (PASS/FLAG/REJECT), and suggestions for improvement.
  agent: coders

network_health_check:
  description: >
    Check Tailscale connectivity between all nodes. Run ping tests, verify
    SSH access is functional on all nodes, and confirm key services are
    reachable (Ollama, ComfyUI, N8N, Dockhand).
  expected_output: >
    Connectivity matrix showing all node pairs, latency measurements,
    and service endpoint status for each node.
  agent: infra
