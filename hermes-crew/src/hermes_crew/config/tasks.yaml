# Hermes Crew - Task Definitions
# Tasks are assigned by the hierarchical Supervisor at runtime.
# These define the scope and expected outputs for each role.

infrastructure_audit:
  description: >
    Perform a health audit of all 8 Tailscale-connected nodes. Check: uptime,
    disk space, Docker container status, GPU availability, Tailscale connectivity,
    and any systemd service failures. Report any anomalies with severity levels.
  expected_output: >
    A structured audit report with per-node status (online/offline, disk%, GPU status,
    key services running), plus a prioritized list of issues ranked by severity
    (critical/warning/info).
  agent: infra

n8n_workflow_deploy:
  description: >
    Design and deploy an N8N workflow on Charlotte (100.70.223.108) for: {workflow_spec}.
    The workflow must include error handling, retry logic, and webhook triggers
    where appropriate.
  expected_output: >
    JSON workflow definition ready for N8N import, plus a deployment summary
    confirming successful activation and describing trigger/action flow.
  agent: n8n_manager

web_service_deploy:
  description: >
    Build and deploy a web service for: {service_spec}.
    Target node: csweb (100.71.6.98). Coordinate with DB Manager for persistence
    and Cloudflare for DNS/routing configuration.
  expected_output: >
    Service deployed and verified at its endpoint. Include: source repo/branch,
    deployment URL, health check result, and any DB migrations applied.
  agent: web_dev

database_migration:
  description: >
    Plan and execute a database schema migration for: {migration_spec}.
    Must include: backup verification, migration script, rollback plan,
    and post-migration validation query.
  expected_output: >
    Migration report with: backup hash verified, SQL executed, row counts before/after,
    and rollback script (if applicable). Confirmation that all dependent services
    still function.
  agent: db_manager

dns_configure:
  description: >
    Configure Cloudflare DNS and/or Tunnel for: {domain_spec}.
    Ensure SSL/TLS is enforced, origin health checks pass, and DNS propagation
    is verified.
  expected_output: >
    DNS record summary (type, name, value, TTL, proxy status), tunnel status
    (if applicable), SSL mode, and propagation check result.
  agent: cloudflare

code_implementation:
  description: >
    Implement the following feature or fix using the Shinobi protocol:
    {code_spec}.
    PRIMARY: shinobi_code — full swarm (scout→coder→builder→reviewer→QA→vanish).
    Use agy_code for quick single-file fixes or ollama_code for simple local tasks.
    Never write code directly — always delegate.
  expected_output: >
    Shinobi mission result: mission_id, subtask status for each phase (scout/coder/
    builder/reviewer/QA), overall PASS/FAIL/ERROR, recovery attempts if any, and
    intel archive path. Include summary of files changed and test results.
  agent: coders

vision_analysis:
  description: >
    Process the following image(s) using the sovereign-vision container on Nano
    (Coral TPU + Florence2): {vision_spec}.
    If the vision container is down, coordinate with Infra to restore it first.
  expected_output: >
    Analysis results (captions, detected objects, text extracted, or whatever
    the spec requires), plus container health confirmation and processing latency.
  agent: vision

art_generation:
  description: >
    Generate visual creative media via ComfyUI on Conchai (primary, RTX 3090 24GB)
    or hq-ai (fallback, P5000 16GB) for: {creative_spec}.
    Capabilities: txt2img, img2img, inpainting, upscaling, batch variations,
    text-to-video (Wan 2.2, HunyuanVideo 1.5), and audio generation.
    Models available: Flux, SDXL, Juggernaut, Wan, HunyuanVideo, Kandinsky.
    For text-based creative (copy, taglines, scripts), coordinate with Copy Studio.
    For quality review, submit output to the Review Agent (qwen3-vl:8b on hq-ai).
  expected_output: >
    Generated media file paths or URLs, workflow used, generation parameters,
    and processing time. For images: include prompt, seed, model, and dimensions.
    For video: include frame count, duration, model, and workflow.
  agent: art_studio

fabrication:
  description: >
    Process a 3D fabrication request via the Fab Studio pipeline: {fab_spec}.
    Pipeline: analyze scanned OBJ from Creality Ferret → Florence 2 vision analysis
    on Jetson Orin → generate parametric CAD in OpenSCAD → render STL/STEP output.
    Use import() to reference scanned mesh as negative space where needed.
    NOT diffusion 3D — this is engineering CAD for physical manufacturing.
    Target use cases: arcade cabinets, TV boxes, e-scooter body panels, Hermes shell.
  expected_output: >
    OpenSCAD source file, rendered STL/STEP file path, Florence 2 analysis summary
    of the scanned object, and dimensions/measurements used. Include render time
    and any assumptions about the physical object's geometry.
  agent: fab_studio

quality_gate:
  description: >
    Perform a critical quality assessment of: {qa_spec}.
    Evaluate: correctness (does it solve the problem?), completeness
    (are edge cases handled?), security (any vulnerabilities?),
    and production readiness (is it deployable?).
    Do NOT re-run tests the coder already ran — focus on judgment.
  expected_output: >
    Verdict (PASS/FLAG/REJECT) with specific, actionable feedback.
    For FLAG: what needs to change. For REJECT: why it can't ship.
    Include the reasoning behind each finding.
  agent: qa

payment_integration:
  description: >
    Implement or update payment processing for: {payment_spec}.
    Must handle: security (PCI considerations), error states, webhook verification,
    and idempotency.
  expected_output: >
    Integration summary with: provider, endpoints configured, webhook secret
    verified, test transaction succeeded (if applicable), and any configuration
    variables set.
  agent: payments

code_review:
  description: >
    Review the following code changes by deploying a Shinobi swarm:
    {review_spec}.
    PRIMARY: shinobi_code — scout maps the changes, reviewer evaluates,
    QA provides final verdict. Falls back to ollama_code for quick reviews.
  expected_output: >
    Shinobi review packet: reviewer assessment, specific issues found,
    QA verdict (PASS/FLAG/REJECT), and suggestions for improvement.
  agent: coders

network_health_check:
  description: >
    Check Tailscale connectivity between all nodes. Run ping tests, verify
    SSH access is functional on all nodes, and confirm key services are
    reachable (Ollama, ComfyUI, N8N, Dockhand).
  expected_output: >
    Connectivity matrix showing all node pairs, latency measurements,
    and service endpoint status for each node.
  agent: infra
